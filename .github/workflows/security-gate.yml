name: Security Gate

# DevSecOps gate for veil's Go monorepo — the single required status check
# meant to block known vulnerabilities and unreviewed findings from reaching
# main/master. veil is a multi-module workspace (21 independent go.mod files
# under pkg/, discovery/, pipeline/, knowledge/, platform/); gosec,
# govulncheck and golangci-lint all need to run per module (Go workspace
# mode does not let `./...` reach across module boundaries, and scanning
# each module standalone with GOWORK=off is also what this repo's own
# Makefile does for tests — see test-pkg-shared, test-pkg-domain), but that
# runs as one loop inside scripts/ci/go-security-checks.sh in a single job
# rather than a 63-way job matrix (one checkout + one tool install per
# scanner, not 21) — same checks, far less duplicated setup. Run it locally
# the same way CI does: `scripts/ci/go-security-checks.sh`.
#
# CodeQL and gitleaks are repo-wide (both understand multi-module Go/git
# history natively) and stay as their own jobs.
#
# See docs/development/security-gate.md for the fixes applied to get every
# one of these gates to a real, verified-clean baseline before this
# workflow shipped — nothing here starts pre-broken or silently warn-only.

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

permissions:
  contents: read
  security-events: write
  actions: read

env:
  GO_VERSION: "1.25.12"
  GOSEC_VERSION: "v2.22.2"
  GOLANGCI_LINT_VERSION: "v2.12.2"

jobs:
  # -------------------------------------------------------------------
  # gosec + govulncheck + golangci-lint, looped over every Go module by
  # scripts/ci/go-security-checks.sh.
  # -------------------------------------------------------------------
  go-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install scanners
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@${{ env.GOSEC_VERSION }}
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}
      - name: gosec + govulncheck + golangci-lint (every module)
        run: scripts/ci/go-security-checks.sh
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: gosec-sarif/gosec.sarif
          category: gosec

  # -------------------------------------------------------------------
  # gitleaks — secret scanning across full git history.
  # -------------------------------------------------------------------
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # -------------------------------------------------------------------
  # CodeQL — Go SAST, repo-wide (autobuild handles the multi-module
  # workspace by discovering each go.mod on its own).
  # -------------------------------------------------------------------
  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: github/codeql-action/init@v4
        with:
          languages: go
          build-mode: autobuild
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:go"
          output: codeql-sarif
      - name: Gate check CodeQL
        if: always()
        run: |
          REPORT="codeql-sarif/go.sarif"
          [ -f "$REPORT" ] || { echo "::error::CodeQL did not produce $REPORT — check the analyze step above; refusing to silently pass a SAST gate with no real report." >&2; exit 1; }
          python3 - <<'PYEOF'
          import json
          d = json.load(open("codeql-sarif/go.sarif"))
          for run in d.get("runs", []):
              for r in run.get("results", []):
                  loc = r.get("locations", [{}])[0].get("physicalLocation", {}).get("artifactLocation", {}).get("uri", "?")
                  line = r.get("locations", [{}])[0].get("physicalLocation", {}).get("region", {}).get("startLine", "?")
                  msg = (r.get("message", {}).get("text") or "").splitlines()[0][:160]
                  print(f"[{r.get('ruleId', '?')}] {loc}:{line} — {msg}")
          PYEOF
          COUNT=$(python3 -c "import json; d=json.load(open('$REPORT')); print(sum(len(r.get('results', [])) for r in d.get('runs', [])))")
          echo "[codeql-go] findings=${COUNT}"
          if [ "$COUNT" -gt 0 ]; then
            echo "::error::${COUNT} CodeQL finding(s) present — see above for file:line and message"
            exit 1
          fi

  # -------------------------------------------------------------------
  # Aggregate gate — THE status check to require in branch protection.
  # -------------------------------------------------------------------
  security-gate:
    if: always()
    runs-on: ubuntu-latest
    needs:
      - go-checks
      - gitleaks
      - codeql
    steps:
      - name: Evaluate required checks
        run: |
          set -eu
          fail=0
          declare -A results=(
            [go-checks]="${{ needs['go-checks'].result }}"
            [gitleaks]="${{ needs.gitleaks.result }}"
            [codeql]="${{ needs.codeql.result }}"
          )
          for job in "${!results[@]}"; do
            r="${results[$job]}"
            echo "$job: $r"
            if [ "$r" != "success" ]; then
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::One or more required gate jobs did not succeed."
            exit 1
          fi
          echo "All required gates passed."
