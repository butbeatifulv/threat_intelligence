# Graph layer: Neo4j, bootstrap, ingest_worker, HTTP API
services:
  neo4j:
    image: neo4j:5
    # Host publish: add -f deploy/knowledge/compose.neo4j-publish.yml (dev browser / local Bolt)
    environment:
      NEO4J_AUTH: neo4j/neo4jpassword
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_apoc_export_file_enabled: "true"
    volumes:
      - neo4j_data:/data
      - ../../var/veil/graph:/var/lib/neo4j/import/user_export
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p neo4jpassword 'RETURN 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30

  graph-bootstrap:
    build:
      context: ../..
      dockerfile: deploy/knowledge/docker/graph-bootstrap.Dockerfile
    volumes:
      - ../../var/veil/graph/releases:/pack/releases:ro
    environment:
      NEO4J_URI: neo4j://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASS: neo4jpassword
      NEO4J_DB: neo4j
      GRAPH_PACK_SKIP: ${GRAPH_PACK_SKIP:-0}
      GRAPH_PACK_DEFAULT: ${GRAPH_PACK_DEFAULT:-1}
      GRAPH_PACK_DEFAULT_VERSION: ${GRAPH_PACK_DEFAULT_VERSION:-${GRAPH_PACK_VERSION:-v0.4.1}}
      GRAPH_PACK_DEFAULT_URL: ${GRAPH_PACK_DEFAULT_URL:-}
    depends_on:
      neo4j:
        condition: service_healthy
    restart: "no"

  ingest_worker:
    build:
      context: ../..
      dockerfile: deploy/knowledge/docker/ingest_worker.Dockerfile
    restart: unless-stopped
    environment:
      NEO4J_URI: neo4j://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASS: neo4jpassword
      NEO4J_DB: neo4j
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      NATS_INGEST_STREAM: INGEST
      NATS_DURABLE: ingest_worker
      NATS_SUBSCRIBE_SUBJECT: ${NATS_SUBSCRIBE_SUBJECT:-ingest.>}
      INGEST_BATCH: ${INGEST_BATCH:-10}
      INGEST_MAX_WAIT: ${INGEST_MAX_WAIT:-5s}
    depends_on:
      neo4j:
        condition: service_healthy
      graph-bootstrap:
        condition: service_completed_successfully

  api:
    build:
      context: ../..
      dockerfile: deploy/knowledge/docker/api.Dockerfile
    ports:
      - "${API_PORT:-8090}:8090"
    environment:
      API_LISTEN: ":8090"
      NEO4J_URI: neo4j://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASS: neo4jpassword
      NEO4J_DB: neo4j
      VEIL_SEARCH_ENGINE: ${VEIL_SEARCH_ENGINE:-bleve}
      VEIL_SEARCH_MODE: ${VEIL_SEARCH_MODE:-hybrid}
      VEIL_BLEVE_INDEX_PATH: /app/docs/skills-index/playbook-search.bleve
      VEIL_QDRANT_URL: ${VEIL_QDRANT_URL:-http://qdrant:6333}
      VEIL_EMBED_PROVIDER: ${VEIL_EMBED_PROVIDER:-ollama}
      VEIL_EMBED_URL: ${VEIL_EMBED_URL:-http://ollama:11434}
      # AUTH_ENABLED: "1"
      # RBAC_ENABLED: "1"
      # KEYCLOAK_ISSUER: https://keycloak.example/realms/veil
      # KEYCLOAK_AUDIENCE: veil-api
    depends_on:
      neo4j:
        condition: service_healthy
      graph-bootstrap:
        condition: service_completed_successfully

  # MCP: stdio (host) + optional Streamable HTTP on 8091 (see docs/agents/mcp-agents.md).
  qdrant:
    image: qdrant/qdrant:v1.13.2
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    profiles:
      - embeddings

  ollama:
    image: ollama/ollama:latest
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - embeddings

  rerank:
    build:
      context: ../..
      dockerfile: deploy/knowledge/docker/rerank.Dockerfile
    ports:
      - "${RERANK_PORT:-8092}:8092"
    profiles:
      - rerank

  mcp:
    profiles:
      - mcp
    build:
      context: ../..
      dockerfile: deploy/knowledge/docker/mcp.Dockerfile
    ports:
      - "${MCP_HTTP_PORT:-8091}:8091"
    environment:
      NEO4J_URI: neo4j://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASS: neo4jpassword
      NEO4J_DB: neo4j
      VEIL_SEARCH_ENGINE: ${VEIL_SEARCH_ENGINE:-bleve}
      VEIL_SEARCH_MODE: ${VEIL_SEARCH_MODE:-hybrid}
      VEIL_BLEVE_INDEX_PATH: /app/docs/skills-index/playbook-search.bleve
      VEIL_QDRANT_URL: ${VEIL_QDRANT_URL:-http://qdrant:6333}
      VEIL_EMBED_PROVIDER: ${VEIL_EMBED_PROVIDER:-ollama}
      VEIL_EMBED_URL: ${VEIL_EMBED_URL:-http://ollama:11434}
      # MCP_HTTP_ENABLED: "1"
      # MCP_HTTP_LISTEN: ":8091"
      # AUTH_ENABLED: "1"
      # KEYCLOAK_ISSUER: https://keycloak.example/realms/veil
    depends_on:
      neo4j:
        condition: service_healthy
      graph-bootstrap:
        condition: service_completed_successfully
    stdin_open: true
    tty: true

volumes:
  neo4j_data:
  qdrant_data:
  ollama_data:
