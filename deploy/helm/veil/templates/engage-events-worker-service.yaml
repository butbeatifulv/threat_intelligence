{{- if and .Values.engage.eventsWorker.enabled (gt (int (.Values.engage.eventsWorker.replicas | default 1)) 0) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "veil.fullname" . }}-engage-events-worker-metrics
  labels:
    app: veil-engage-events-worker
spec:
  selector:
    app: veil-engage-events-worker
  ports:
    - name: metrics
      port: 9090
      targetPort: metrics
{{- end }}
