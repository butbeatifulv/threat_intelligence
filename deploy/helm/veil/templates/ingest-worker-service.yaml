{{- if gt (int .Values.ingest.worker.replicas) 0 }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "veil.fullname" . }}-ingest-worker-metrics
  labels:
    app: veil-ingest-worker
spec:
  selector:
    app: veil-ingest-worker
  ports:
    - name: metrics
      port: 9090
      targetPort: metrics
{{- end }}
