apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "veil.fullname" . }}-ingest-worker
spec:
  replicas: {{ .Values.ingest.worker.replicas }}
  selector:
    matchLabels:
      app: veil-ingest-worker
  template:
    metadata:
      labels:
        app: veil-ingest-worker
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: ingest-worker
          image: "{{ .Values.global.imageRegistry }}veil-ingest-worker:{{ .Values.global.imageTag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 9090
          env:
            - name: OTEL_SERVICE_NAME
              value: veil-ingest-worker
            {{- include "veil.observabilityEnv" . | nindent 12 }}
            - name: METRICS_LISTEN
              value: {{ .Values.observability.metricsListen | quote }}
            - name: NATS_URL
              value: {{ .Values.global.natsUrl | quote }}
            - name: NEO4J_URI
              value: {{ .Values.global.neo4jUri | quote }}
