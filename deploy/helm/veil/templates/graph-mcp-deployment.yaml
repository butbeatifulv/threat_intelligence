{{- if .Values.graph.mcp.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "veil.fullname" . }}-mcp
spec:
  replicas: {{ .Values.graph.mcp.replicas }}
  selector:
    matchLabels:
      app: veil-mcp
  template:
    metadata:
      labels:
        app: veil-mcp
    spec:
      enableServiceLinks: false
      containers:
        - name: mcp
          image: "{{ .Values.global.imageRegistry }}veil-mcp:{{ .Values.global.imageTag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8091
          env:
            - name: OTEL_SERVICE_NAME
              value: veil-mcp
            {{- include "veil.observabilityEnv" . | nindent 12 }}
            - name: MCP_ENV
              value: prod
            - name: NEO4J_URI
              value: {{ .Values.global.neo4jUri | quote }}
            - name: MCP_HTTP_ENABLED
              value: "1"
            - name: MCP_HTTP_LISTEN
              value: ":8091"
          volumeMounts:
            - name: veil-playbooks
              mountPath: /home/nonroot/docs/skills-index
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: 8091
            initialDelaySeconds: 30
      volumes:
        - name: veil-playbooks
          hostPath:
            path: /var/lib/veil/playbooks/docs/skills-index
            type: Directory
{{- end }}
