{{- if gt (int .Values.pipeline.worker.replicas) 0 }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "veil.fullname" . }}-pipeline-worker-metrics
  labels:
    app: veil-pipeline-worker
spec:
  selector:
    app: veil-pipeline-worker
  ports:
    - name: metrics
      port: 9090
      targetPort: metrics
{{- end }}
