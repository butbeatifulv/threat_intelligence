apiVersion: v1
kind: Service
metadata:
  name: {{ include "veil.fullname" . }}-ingest-worker-metrics
  labels:
    app: veil-ingest-worker
spec:
  type: ClusterIP
  selector:
    app: veil-ingest-worker
  ports:
    - name: metrics
      port: 9090
      targetPort: 9090
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "veil.fullname" . }}-pipeline-worker-metrics
  labels:
    app: veil-pipeline-worker
spec:
  type: ClusterIP
  selector:
    app: veil-pipeline-worker
  ports:
    - name: metrics
      port: 9090
      targetPort: 9090
---
{{- if .Values.engage.eventsWorker.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "veil.fullname" . }}-engage-events-worker-metrics
  labels:
    app: veil-engage-events-worker
spec:
  type: ClusterIP
  selector:
    app: veil-engage-events-worker
  ports:
    - name: metrics
      port: 9090
      targetPort: 9090
{{- end }}
