# Unified edge upstreams (P12). Engage/veneno services may run in veneno compose on same network.
# Override hostnames via compose extra_hosts or external VENENO_API_HOST when split.
upstream api {
    server api:8090;
    keepalive 8;
}

upstream mcp {
    server mcp:8091;
    keepalive 4;
}

upstream engage-api {
    server engage-api:8890;
    keepalive 4;
}

upstream engage-mcp {
    server engage-mcp:8892;
    keepalive 4;
}
